  <meta name="theme-color" content="#0b0b0d">
  <script>
    // The saved theme before the first paint, so a light console never flashes dark.
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('fbc_theme') || 'system'; } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      // and the saved zoom (top bar − / +), so the page opens at the size it was left
      var z = 1;
      try { z = parseFloat(localStorage.getItem('fbc_zoom')) || 1; } catch (e) {}
      if (z >= 0.5 && z <= 2) document.documentElement.style.setProperty('--zoom', z);
    })();
  </script>

        <div id="meAvatar"></div>
        <div class="me-text"><b id="whoName"></b><small id="who"></small></div>

                aria-label="Sign out" title="Sign out"></button>
      </div>
      <div id="version" class="rail-version"></div>
    </div>

  <div class="main">
    <header class="topbar">
      <div class="field" style="min-width:220px">
        <label for="farmPick">FarmBox</label>
        <select id="farmPick" aria-label="Which FarmBox"></select>
      </div>
      <div class="grow"></div>
      <span class="pill" id="envPill">Supabase</span>
      <div class="zoom" id="zoom" role="group" aria-label="Zoom"></div>
      <button class="pill net" id="net" type="button" aria-live="polite"></button>
      <span class="top-version" id="topVersion" title="Naked Heart version — Settings › Version log"></span>
      <div class="upd" id="upd" hidden></div>
      <button class="btn btn-sm topbar-ai" id="aiBtn" type="button" title="The assistant: questions, planning, imports, reports">✦ Assistant</button>
      <button class="btn btn-ghost btn-icon topbar-gear" id="settingsBtn" type="button"
              data-icon="settings" aria-label="Settings" title="Settings"></button>
    </header>
    <div class="offline-bar" id="offlineBar" hidden></div>
    <nav class="sec-tabs" id="secTabs" hidden></nav>
    <main class="page" id="page"></main>
  </div>

<script type="module" src="js/app.js?v=20260926e"></script>
<script>
  // Installable, and it still opens when the signal drops between the
  // office and the container. The worker is network-first, so being
  // installed never means running last week's code.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
