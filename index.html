<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FarmBox Console</title>
  <meta name="description" content="Run a FarmBox: people, plans, procedures, crops.">
  <meta name="theme-color" content="#0b0b0d">
  <script>
    // The saved theme before the first paint, so a light console never flashes dark.
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('fbc_theme') || 'system'; } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <!-- bump ?v when the stylesheet changes: a static host will serve the old one otherwise -->
  <link rel="stylesheet" href="styles.css?v=20260921g">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png?v=2" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FarmBox">
</head>
<body>

<!-- sign in ─────────────────────────────────────────────────────────────── -->
<main class="signin" id="signin" hidden>
  <form class="card card-pad" id="signinForm">
    <div class="brand">
      <span class="mark" data-icon="sprout" aria-hidden="true"></span>
      <span><b>FarmBox Console</b><small>Naked Farm</small></span>
    </div>
    <div class="field" style="margin-bottom:var(--space-4)">
      <label for="si-email">E-mail</label>
      <input id="si-email" type="email" autocomplete="username" required>
    </div>
    <div class="field" style="margin-bottom:var(--space-5)">
      <label for="si-pass">Password</label>
      <input id="si-pass" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" style="width:100%" id="si-go" type="submit">Sign in</button>
    <div class="note bad" id="si-err" hidden style="margin-top:var(--space-4)"></div>
  </form>
</main>

<!-- the console ─────────────────────────────────────────────────────────── -->
<div class="shell" id="shell" hidden>
  <nav class="rail" aria-label="Sections">
    <div class="brand">
      <span class="mark" data-icon="sprout" aria-hidden="true"></span>
      <span><b>FarmBox</b><small>Console</small></span>
      <button class="rail-toggle" id="railToggle" type="button" data-icon="chevronLeft"
              aria-label="Collapse the menu" title="Collapse the menu" aria-expanded="true"></button>
    </div>

    <div class="rail-group">This FarmBox</div>
    <a href="#/dashboard" data-route="dashboard" data-icon="dashboard">Dashboard</a>
    <a href="#/week" data-route="week" data-icon="calendar">Weekly plan</a>
    <a href="#/crops" data-route="crops" data-icon="sprout">Crops &amp; plan</a>
    <a href="#/harvest" data-route="harvest" data-icon="basket">Harvest</a>
    <a href="#/cropdb" data-route="cropdb" data-icon="database">Crop database</a>
    <a href="#/procedures" data-route="procedures" data-icon="clipboard">Procedures</a>
    <a href="#/maintenance" data-route="maintenance" data-icon="wrench">Maintenance</a>
    <a href="#/purchasing" data-route="purchasing" data-icon="cart">Purchasing</a>
    <a href="#/prices" data-route="prices" data-icon="trend">Prices &amp; market</a>
    <a href="#/issues" data-route="issues" data-icon="alert">Issues</a>
    <a href="#/reports" data-route="reports" data-icon="chart">Reports</a>
    <a href="#/people" data-route="people" data-icon="users">People</a>
    <a href="#/farm" data-route="farm" data-icon="farm">Farm setup</a>

    <div class="rail-group">Franchisor</div>
    <a href="#/units" data-route="units" data-icon="globe">All FarmBoxes</a>

    <div class="rail-foot">
      <div class="me">
        <div id="meAvatar"></div>
        <div class="me-text"><b id="whoName"></b><small id="who"></small></div>
        <button class="btn btn-ghost btn-icon" id="signout" data-icon="logout"
                aria-label="Sign out" title="Sign out"></button>
      </div>
      <div id="version" class="rail-version"></div>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="field" style="min-width:220px">
        <label for="farmPick">FarmBox</label>
        <select id="farmPick" aria-label="Which FarmBox"></select>
      </div>
      <div class="grow"></div>
      <span class="pill" id="envPill">Supabase</span>
      <button class="pill net" id="net" type="button" aria-live="polite"></button>
      <span class="top-version" id="topVersion" title="FarmBox Console version — Settings › Version log"></span>
      <div class="upd" id="upd" hidden></div>
      <button class="btn btn-ghost btn-icon topbar-gear" id="settingsBtn" type="button"
              data-icon="settings" aria-label="Settings" title="Settings"></button>
    </header>
    <div class="offline-bar" id="offlineBar" hidden></div>
    <main class="page" id="page"></main>
  </div>
</div>

<script type="module" src="js/app.js?v=20260921g"></script>
<script>
  // Installable, and it still opens when the signal drops between the
  // office and the container. The worker is network-first, so being
  // installed never means running last week's code.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
